<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b14"/>
      <stop offset="50%" stop-color="#0b172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="neonIce" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Outer Tech Border -->
  <path d="M256 40 L450 120 L450 340 L256 472 L62 340 L62 120 Z" 
        fill="none" stroke="url(#neonCyan)" stroke-width="6" opacity="0.4"/>
  <path d="M256 56 L434 130 L434 326 L256 450 L78 326 L78 130 Z" 
        fill="#081426" opacity="0.85"/>

  <!-- Glowing Esports Emblem Shield -->
  <polygon points="256,76 414,142 414,316 256,430 98,316 98,142" 
           fill="#0b1e36" stroke="url(#neonIce)" stroke-width="4" filter="url(#glow)"/>

  <!-- Energy Lines -->
  <line x1="256" y1="80" x2="256" y2="424" stroke="#06b6d4" stroke-width="2" stroke-dasharray="8 8" opacity="0.5"/>
  <line x1="108" y1="256" x2="404" y2="256" stroke="#38bdf8" stroke-width="1.5" opacity="0.3"/>

  <!-- Wings / Chevron Accents -->
  <path d="M140 180 L200 240 L160 300" fill="none" stroke="url(#neonCyan)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M372 180 L312 240 L352 300" fill="none" stroke="url(#neonIce)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Center Stylized 'FT' Letters -->
  <!-- F -->
  <path d="M190 190 H245 M190 235 H235 M190 190 V295" 
        fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- T -->
  <path d="M260 190 H320 M290 190 V295" 
        fill="none" stroke="url(#neonIce)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Crosshair Esports Target Center -->
  <circle cx="256" cy="242" r="12" fill="none" stroke="#22d3ee" stroke-width="3" opacity="0.9"/>
  <circle cx="256" cy="242" r="3" fill="#38bdf8"/>

  <!-- Banner Bottom Tag -->
  <rect x="166" y="340" width="180" height="36" rx="6" fill="#0284c7" filter="url(#glow)"/>
  <text x="256" y="365" font-family="'Impact', 'Arial Black', sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">HOST</text>
  
  <text x="256" y="405" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="3">FREE FIRE ESPORTS</text>
</svg>
